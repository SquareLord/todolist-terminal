name: taskman notifications

on:
  schedule:
    # Runs every 15 minutes, 24/7
    - cron: "*/15 * * * *"
  workflow_dispatch:  # lets you trigger it manually from GitHub UI

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit notified.json back

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run notification checker
        env:
          NTFY_TOPIC:  ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}   # optional, defaults to ntfy.sh
        run: python notify.py

      - name: Commit notified.json if changed
        run: |
          git config user.name  "taskman-bot"
          git config user.email "taskman-bot@users.noreply.github.com"
          git add notified.json
          git diff --cached --quiet || git commit -m "chore: update notified.json [skip ci]"
          git push
